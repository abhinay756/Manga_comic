<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ComicEngine · Review</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="public-review">
  <div class="page-shell">
    <header>
      <div>
        <p class="brand"><span class="brand-name">ComicEngine</span> <span class="beta-pill">Beta</span></p>
        <h1>Stories</h1>
      </div>
      <div class="status nav-links">
        <span class="muted small" id="whoHint">Enter your name to start</span>
      </div>
    </header>

    <section class="story-meta">
      <p class="lede">Read a comic, rate panels, then answer a short Mom Test questionnaire. No account — just your name.</p>
      <label class="pe-label" for="displayName">Your name</label>
      <div class="link-row">
        <input id="displayName" type="text" maxlength="80" placeholder="e.g. Priya" autocomplete="nickname" />
        <button type="button" class="btn pe-primary" id="saveName">Save name</button>
      </div>
      <p class="muted small" id="nameStatus"></p>
    </section>

    <section class="comic-grid" id="storyGrid"></section>
  </div>
  <script src="/static/review/review.js"></script>
  <script>ReviewHome.init();</script>
  <footer class="site-footer">
    <p>© 2026 Abhinay · Manga Engine</p>
    <p class="muted small">AI comic pipeline — beta preview. Built by Abhinay (<a href="https://github.com/navinash47" target="_blank" rel="noopener">@navinash47</a>).</p>
  </footer>
</body>
</html>
